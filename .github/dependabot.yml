# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/webviewer-vue" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/webviewer-react"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/webviewer-angular"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/webviewer-nextjs"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/webviewer-nuxtjs"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
