name: tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-e2e-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover changed webviewer projects with e2e tests
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"
          changed_files=()

          if [ "$event_name" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            mapfile -t changed_files < <(git diff --name-only "$base_sha...$head_sha")
          elif [ "$event_name" = "push" ]; then
            before_sha="${{ github.event.before }}"
            after_sha="${{ github.sha }}"

            if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              mapfile -t changed_files < <(git show --pretty='' --name-only "$after_sha")
            else
              mapfile -t changed_files < <(git diff --name-only "$before_sha..$after_sha")
            fi
          else
            echo "Unsupported event '$event_name' for changed-file discovery."
          fi

          declare -A affected_map=()
          for file_path in "${changed_files[@]}"; do
            top_level="${file_path%%/*}"
            if [[ "$top_level" == webviewer-* ]]; then
              affected_map["$top_level"]=1
            fi
          done

          affected=()
          for project in "${!affected_map[@]}"; do
            affected+=("$project")
          done
          if [ ${#affected[@]} -gt 0 ]; then
            IFS=$'\n' affected=($(printf '%s\n' "${affected[@]}" | sort))
          fi

          selected=()
          for project in "${affected[@]}"; do
            if [ -d "$project/__tests__/e2e" ]; then
              selected+=("$project")
            fi
          done

          if [ ${#selected[@]} -eq 0 ]; then
            echo "No changed webviewer-* projects with __tests__/e2e were found."
            echo 'matrix={"project":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          joined=$(IFS=,; echo "${selected[*]}")
          matrix_json=$(SELECTED="$joined" node -e "const projects=(process.env.SELECTED||'').split(',').filter(Boolean); process.stdout.write(JSON.stringify({ project: projects }));")
          echo "Discovered projects: ${selected[*]}"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"

  run-e2e-tests:
    needs: discover-e2e-projects
    if: needs.discover-e2e-projects.outputs.count != '0'
    # IIS Express is Windows-only, so the ASP.NET project must run on a Windows runner.
    runs-on: ${{ matrix.project == 'webviewer-annotations-aspnet' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-e2e-projects.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Angular CLI 22 requires Node >=24.15.0 (or >=22.22.3).
          # Pinning prevents runner image drift from selecting an older 24.x.
          node-version: 24.15.0

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Validate e2e script exists
        shell: bash
        run: |
          node -e "const scripts = (require('./package.json').scripts || {}); if (!scripts['test:e2e']) { console.error('Missing test:e2e script in package.json'); process.exit(1); }"

      - name: Prepare test assets
        shell: bash
        run: npm run postinstall --if-present

      - name: Ensure IIS Express is installed
        if: matrix.project == 'webviewer-annotations-aspnet'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe",
            "${env:ProgramFiles}\IIS Express\iisexpress.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $found) {
            Write-Host "IIS Express not found, installing..."
            choco install iisexpress -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Failed to install IIS Express" }
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $found) { throw "iisexpress.exe not found after installation" }

          Write-Host "Using IIS Express at $found"
          "IISEXPRESS_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build ASP.NET site
        if: matrix.project == 'webviewer-annotations-aspnet'
        shell: pwsh
        run: |
          # The site must be built so that /bin is populated before IIS Express serves it.
          Set-Location server
          nuget restore webviewer-annotations-asp-net-sample.sln
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }
          msbuild webviewer-annotations-asp-net-sample.sln /p:Configuration=Debug /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - name: Run e2e tests
        run: npm run test:e2e
